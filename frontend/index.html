<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Study Buddy - Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .upload-card { background: white; border-radius: 15px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 upload-card text-center">
                <h1 class="mb-4">🎓 AI Study Buddy</h1>
                <p class="text-muted">Upload your lecture audio to start studying.</p>
                <div class="mb-3">
                    <input type="file" id="audioFile" class="form-control" accept="audio/*">
                </div>
                <button onclick="uploadAudio()" id="uploadBtn" class="btn btn-primary btn-lg w-100">Upload & Process</button>
                <div id="status" class="mt-3 fw-bold text-primary"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
